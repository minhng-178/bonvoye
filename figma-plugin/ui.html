<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>BonVoye — Plugin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  color: #1a2430;
  background: #f0f4f8;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────────────────────── */
.header {
  background: #1a2430;
  color: #fff;
  padding: 16px 18px;
  flex: 0 0 auto;
}
.header-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-logo {
  width: 28px;
  height: 28px;
  background: #b4472b;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex: 0 0 auto;
}
.header-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.header-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-top: 2px;
}

/* ── Content ─────────────────────────────────────────────────────────────────── */
.content {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.drop-zone {
  margin: 14px;
  border: 2px dashed #c8d5e0;
  border-radius: 12px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #fff;
  position: relative;
}
.drop-zone.dragover {
  border-color: #b4472b;
  background: #fdf4f0;
}
.drop-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.drop-icon { font-size: 32px; margin-bottom: 10px; }
.drop-title { font-size: 13.5px; font-weight: 600; color: #1a2430; margin-bottom: 4px; }
.drop-sub { font-size: 11px; color: #8899aa; line-height: 1.45; }

.screens-info {
  margin: 0 14px;
  padding: 14px;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0eaf0;
  display: none;
}
.screens-info.visible { display: block; }
.screens-info-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.screens-count {
  font-size: 22px;
  font-weight: 800;
  color: #b4472b;
  letter-spacing: -0.03em;
}
.screens-count-label {
  font-size: 11px;
  color: #8899aa;
  margin-top: 1px;
}
.screens-clear {
  background: none;
  border: 1px solid #e0eaf0;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  color: #8899aa;
  cursor: pointer;
}
.screens-clear:hover { background: #f5f8fa; color: #1a2430; }

.groups-list {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.group-chip {
  font-size: 10px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  background: #eef4f8;
  color: #4a6070;
  border: 1px solid #d5e5ee;
}

/* ── Progress ────────────────────────────────────────────────────────────────── */
.progress-section {
  margin: 12px 14px 0;
  display: none;
}
.progress-section.visible { display: block; }
.progress-bar-outer {
  height: 6px;
  background: #e0eaf0;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-inner {
  height: 100%;
  background: #b4472b;
  border-radius: 4px;
  width: 0%;
  transition: width 0.2s ease;
}
.progress-label {
  font-size: 10.5px;
  color: #8899aa;
  line-height: 1.4;
}
.progress-count {
  font-weight: 700;
  color: #1a2430;
}

.log-area {
  margin: 8px 14px 0;
  background: #1a2430;
  border-radius: 8px;
  padding: 8px 10px;
  font-family: "SF Mono", Menlo, monospace;
  font-size: 9.5px;
  color: #7ab8d0;
  line-height: 1.6;
  max-height: 80px;
  overflow-y: auto;
  display: none;
}
.log-area.visible { display: block; }

.success-banner {
  margin: 8px 14px 0;
  padding: 10px 14px;
  background: #e8f5ea;
  border: 1px solid #b6d9bc;
  border-radius: 8px;
  color: #2a6838;
  font-size: 12px;
  font-weight: 600;
  display: none;
}
.success-banner.visible { display: flex; align-items: center; gap: 8px; }

/* ── Footer ─────────────────────────────────────────────────────────────────── */
.footer {
  padding: 12px 14px 14px;
  flex: 0 0 auto;
  background: #f0f4f8;
  border-top: 1px solid #dde8f0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn-primary {
  width: 100%;
  height: 42px;
  background: #b4472b;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover:not(:disabled) { background: #9a3b23; }
.btn-primary:active:not(:disabled) { transform: translateY(1px); }
.btn-primary:disabled { background: #c89f96; cursor: not-allowed; }

.btn-secondary {
  width: 100%;
  height: 36px;
  background: #fff;
  color: #4a6070;
  border: 1px solid #d0dde8;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-secondary:hover { background: #f5f8fa; color: #1a2430; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-logo">🗺</div>
    <div>
      <div class="header-title">BonVoye Mockups Builder</div>
      <div class="header-sub">Vẽ prototype screens vào Figma</div>
    </div>
  </div>
</div>

<div class="content">
  <div class="drop-zone" id="drop-zone">
    <input type="file" accept=".json" id="file-input">
    <div class="drop-icon">📂</div>
    <div class="drop-title">Chọn mockup-screens.json</div>
    <div class="drop-sub">Chạy <code>node capture.js</code> trong thư mục<br><code>figma-plugin/</code> để tạo file này.</div>
  </div>

  <div class="screens-info" id="screens-info">
    <div class="screens-info-top">
      <div>
        <div class="screens-count" id="screens-count">0</div>
        <div class="screens-count-label">màn hình sẵn sàng vẽ</div>
      </div>
      <button class="screens-clear" onclick="clearData()">✕ Xoá</button>
    </div>
    <div class="groups-list" id="groups-list"></div>
  </div>

  <div class="progress-section" id="progress-section">
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progress-bar"></div>
    </div>
    <div class="progress-label">
      <span class="progress-count" id="progress-count">0</span> / <span id="progress-total">0</span> — <span id="progress-title">Đang chuẩn bị...</span>
    </div>
  </div>

  <div class="log-area" id="log-area"></div>

  <div class="success-banner" id="success-banner">
    ✅ <span id="success-text">Hoàn tất!</span>
  </div>

  <div style="flex: 1;"></div>
</div>

<div class="footer">
  <button class="btn-primary" id="btn-draw" onclick="startDraw()" disabled>
    📲 Vẽ vào Figma
  </button>
  <button class="btn-secondary" onclick="parent.postMessage({pluginMessage:{type:'close'}},'*')">Đóng</button>
</div>

<script>
let screens = null;

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.json')) loadFile(file);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      screens = JSON.parse(e.target.result);
      showScreensInfo(screens);
    } catch (err) {
      alert('❌ Không đọc được JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function showScreensInfo(data) {
  document.getElementById('screens-count').textContent = data.length;
  document.getElementById('screens-info').classList.add('visible');
  document.getElementById('btn-draw').disabled = false;

  const groups = {};
  data.forEach(s => { groups[s.group] = (groups[s.group] || 0) + 1; });
  const gl = document.getElementById('groups-list');
  gl.innerHTML = Object.entries(groups).map(([g, n]) =>
    `<span class="group-chip">${g} (${n})</span>`
  ).join('');

  dropZone.style.display = 'none';
}

function clearData() {
  screens = null;
  document.getElementById('screens-info').classList.remove('visible');
  document.getElementById('btn-draw').disabled = true;
  dropZone.style.display = '';
  fileInput.value = '';
  document.getElementById('success-banner').classList.remove('visible');
  document.getElementById('progress-section').classList.remove('visible');
  document.getElementById('log-area').classList.remove('visible');
  document.getElementById('log-area').textContent = '';
}

function startDraw() {
  if (!screens) return;
  document.getElementById('btn-draw').disabled = true;
  document.getElementById('btn-draw').textContent = '⏳ Đang vẽ...';
  document.getElementById('progress-section').classList.add('visible');
  document.getElementById('log-area').classList.add('visible');
  document.getElementById('progress-total').textContent = screens.length;

  parent.postMessage({ pluginMessage: { type: 'draw-all-screens', screens } }, '*');
}

window.onmessage = (e) => {
  const msg = e.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'progress') {
    const pct = Math.round((msg.current / msg.total) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-count').textContent = msg.current;
    document.getElementById('progress-title').textContent = msg.title || '';
    const log = document.getElementById('log-area');
    log.textContent += `[${msg.current}/${msg.total}] ${msg.title}\n`;
    log.scrollTop = log.scrollHeight;
  }

  if (msg.type === 'done') {
    document.getElementById('btn-draw').textContent = '📲 Vẽ lại';
    document.getElementById('btn-draw').disabled = false;
    document.getElementById('progress-bar').style.width = '100%';
    const banner = document.getElementById('success-banner');
    banner.classList.add('visible');
    document.getElementById('success-text').textContent =
      `Đã vẽ ${msg.count} màn hình vào page "BonVoye Mockups"!`;
  }

  if (msg.type === 'error') {
    const log = document.getElementById('log-area');
    log.style.color = '#ff7070';
    log.textContent += '❌ ' + msg.message + '\n';
    log.classList.add('visible');
    document.getElementById('btn-draw').disabled = false;
    document.getElementById('btn-draw').textContent = '📲 Vẽ vào Figma';
  }
};
</script>
</body>
</html>
